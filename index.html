<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎰 Calorie Lottery</title>
<style>
:root {
  --primary: #ff6b9d;
  --secondary: #c44569;
  --accent: #ffc048;
  --success: #26de81;
  --bg: #1a1a2e;
  --card: #16213e;
  --text: #eaeaea;
  --text-muted: #a0a0a0;
}
* {margin:0;padding:0;box-sizing:border-box;}
body {
  font-family:'Segoe UI',system-ui,sans-serif;
  background:linear-gradient(135deg,var(--bg) 0%,#0f0f1a 100%);
  color:var(--text);min-height:100vh;padding:20px;
}
.container{max-width:500px;margin:0 auto;}
header{text-align:center;margin-bottom:20px;}
header h1{font-size:2rem;background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;color:transparent;text-shadow:0 0 30px rgba(255,107,157,0.3);}
.tagline{color:var(--text-muted);margin-top:5px;}
.stats-bar{display:flex;justify-content:space-around;background:var(--card);border-radius:16px;
  padding:15px;margin-bottom:20px;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;}
.stat-icon{font-size:1.5rem;}
.stat-label{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}
.stat-value{font-size:1.25rem;font-weight:bold;color:var(--accent);}
.lottery-section{text-align:center;}
.slot-machine{background:linear-gradient(145deg,#2a2a4a,#1a1a2e);border-radius:24px;padding:30px;
  box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
  border:3px solid var(--secondary);}
.slot-window{background:#0a0a15;border-radius:12px;padding:20px;border:4px solid var(--accent);
  box-shadow:inset 0 4px 20px rgba(0,0,0,.5);overflow:hidden;height:80px;
  display:flex;align-items:center;justify-content:center;}
.slot-reel{font-size:2.5rem;font-weight:bold;color:var(--accent);
  text-shadow:0 0 20px var(--accent);transition:transform .1s;}
.slot-reel.spinning{animation:spin .1s linear infinite;}
@keyframes spin{0%{transform:translateY(-10px);opacity:.5;}50%{transform:translateY(10px);opacity:1;}100%{transform:translateY(-10px);opacity:.5;}}
.spin-btn{position:relative;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:none;
  padding:18px 50px;font-size:1.25rem;font-weight:bold;border-radius:50px;cursor:pointer;overflow:hidden;
  transition:transform .2s,box-shadow .2s;box-shadow:0 6px 20px rgba(255,107,157,.4);}
.spin-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,107,157,.6);}
.spin-btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-shine{position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  animation:shine 2s infinite;}
@keyframes shine{0%{left:-100%;}50%,100%{left:100%;}}
.hint{margin-top:20px;color:var(--text-muted);font-size:.9rem;}
.hidden{display:none!important;}
.goal-card{background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:20px;
  padding:25px;display:flex;align-items:center;gap:15px;box-shadow:0 8px 30px rgba(255,107,157,.3);}
.goal-emoji{font-size:3rem;}
.goal-value{font-size:2.5rem;font-weight:bold;}
.input-section{background:var(--card);border-radius:16px;padding:20px;margin:20px 0;}
.input-group{display:flex;gap:10px;}
.input-group input{flex:1;padding:14px 18px;border:2px solid transparent;border-radius:12px;background:var(--bg);
  color:var(--text);font-size:1rem;}
.add-btn{padding:14px 24px;background:var(--success);color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer;}
.progress-section{background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;}
.progress-bar{height:24px;background:var(--bg);border-radius:12px;overflow:hidden;position:relative;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--success),#7bed9f);border-radius:12px;transition:width .5s;width:0;}
.progress-fill.over{background:linear-gradient(90deg,#ff6b6b,#ee5a24);}
.progress-marker{position:absolute;top:0;height:100%;width:3px;background:var(--accent);box-shadow:0 0 10px var(--accent);left:100%;}
.food-log{background:var(--card);border-radius:16px;padding:20px;}
#log-list{list-style:none;max-height:200px;overflow-y:auto;}
#log-list li{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg);
border-radius:10px;margin-bottom:8px;}
.delete-btn{background:transparent;border:none;color:#ff6b6b;cursor:pointer;font-size:1.2rem;}
.complete-btn{width:100%;padding:18px;background:linear-gradient(135deg,var(--accent),#f7b731);
color:var(--bg);border:none;border-radius:16px;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-top:10px;}
.badges-section{background:var(--card);border-radius:16px;padding:20px;margin-top:20px;}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;}
.badge{display:flex;flex-direction:column;align-items:center;padding:10px;background:var(--bg);border-radius:12px;}
.badge.locked{opacity:.3;filter:grayscale(1);}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000;}
.popup{background:var(--card);border-radius:24px;padding:40px;text-align:center;max-width:350px;width:90%;border:2px solid var(--primary);}
.popup-emoji{font-size:4rem;margin-bottom:10px;}
.popup-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:none;
  padding:10px 30px;border-radius:30px;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎰 Calorie Lottery 🍀</h1>
    <p class="tagline">Spin to reveal today's calorie goal!</p>
  </header>
  <div class="stats-bar">
    <div class="stat"><span class="stat-icon">🔥</span><span class="stat-label">Streak</span><span id="streak">0</span></div>
    <div class="stat"><span class="stat-icon">⭐</span><span class="stat-label">Points</span><span id="points">0</span></div>
    <div class="stat"><span class="stat-icon">🏆</span><span class="stat-label">Badges</span><span id="badge-count">0</span></div>
  </div>
  <section id="lottery-section" class="lottery-section">
    <div class="slot-machine">
      <div class="slot-window"><div class="slot-reel" id="reel">???</div></div>
      <button id="spin-btn" class="spin-btn"><span>🎲 SPIN!</span><span class="btn-shine"></span></button>
    </div>
    <p class="hint">Pull the lever to get your daily calorie goal!</p>
  </section>

  <section id="tracking-section" class="hidden">
    <div class="goal-card"><span class="goal-emoji">🎯</span><div><div>Today's Goal</div><div class="goal-value" id="goal-value">0</div></div></div>
    <div class="input-section"><div class="input-group"><input type="number" id="calorie-input" placeholder="Enter calories" min="0"/><button id="add-btn" class="add-btn">+ Add</button></div></div>
    <div class="progress-section"><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div><div class="progress-marker" id="progress-marker"></div></div>
    <div id="progress-text" style="text-align:center;margin-top:8px;">0 / 0</div></div>
    <div class="food-log"><h3>📝 Today's Log</h3><ul id="log-list"></ul></div>
    <button id="complete-btn" class="complete-btn hidden">✨ Complete Day ✨</button>
  </section>

  <section class="badges-section"><h3>🏅 Your Badges</h3><div class="badges-grid" id="badges-grid"></div></section>

  <div id="popup-overlay" class="popup-overlay hidden"><div class="popup"><span id="popup-emoji" class="popup-emoji">🎉</span><h2 id="popup-title">Nice!</h2><p id="popup-message"></p><div id="popup-reward"></div><button id="popup-close" class="popup-btn">Yay!</button></div></div>
</div>

<script>
const CONFIG={minCalories:1200,maxCalories:1800,stepSize:100,spinDuration:2000,storageKey:'calorieLottery'};
const CALORIE_OPTIONS=[];for(let c=CONFIG.minCalories;c<=CONFIG.maxCalories;c+=CONFIG.stepSize){CALORIE_OPTIONS.push(c);}
const REWARDS=[{emoji:'🌈',text:'+10 pts'},{emoji:'🍀',text:'+15 pts'},{emoji:'⭐',text:'+20 pts'},{emoji:'🎁',text:'+25 pts'}];
let state={goal:null,consumed:0,log:[],streak:0,points:0,hasSpun:false,date:null};

const el={
  reel:document.getElementById('reel'),
  spin:document.getElementById('spin-btn'),
  lsec:document.getElementById('lottery-section'),
  tsec:document.getElementById('tracking-section'),
  goal:document.getElementById('goal-value'),
  input:document.getElementById('calorie-input'),
  add:document.getElementById('add-btn'),
  fill:document.getElementById('progress-fill'),
  marker:document.getElementById('progress-marker'),
  text:document.getElementById('progress-text'),
  list:document.getElementById('log-list'),
  done:document.getElementById('complete-btn'),
  streak:document.getElementById('streak'),
  points:document.getElementById('points'),
  badgeCount:document.getElementById('badge-count'),
  badges:document.getElementById('badges-grid'),
  popO:document.getElementById('popup-overlay'),
  popE:document.getElementById('popup-emoji'),
  popT:document.getElementById('popup-title'),
  popM:document.getElementById('popup-message'),
  popR:document.getElementById('popup-reward'),
  popC:document.getElementById('popup-close')
};

function save(){localStorage.setItem(CONFIG.storageKey,JSON.stringify(state));}
function load(){let s=localStorage.getItem(CONFIG.storageKey);if(s){state={...state,...JSON.parse(s)};}}
function today(){return new Date().toDateString();}
function checkDay(){if(state.date!==today()){state.hasSpun=false;state.goal=null;state.consumed=0;state.log=[];state.date=null;save();}}
load();checkDay();
if(state.hasSpun&&state.goal){showTrack();update();}
el.spin.onclick=spin;el.add.onclick=add;el.input.onkeypress=e=>{if(e.key==='Enter')add();};
el.done.onclick=complete;el.popC.onclick=()=>el.popO.classList.add('hidden');

function spin(){
  if(state.hasSpun)return;
  el.spin.disabled=true;
  el.reel.classList.add('spinning');
  let i=setInterval(()=>{el.reel.innerText=CALORIE_OPTIONS[Math.floor(Math.random()*CALORIE_OPTIONS.length)];},80);
  setTimeout(()=>{clearInterval(i);el.reel.classList.remove('spinning');
    const val=CALORIE_OPTIONS[Math.floor(Math.random()*CALORIE_OPTIONS.length)];
    el.reel.innerText=val;
    state.goal=val;state.hasSpun=true;state.date=today();save();setTimeout(showTrack,500);
  },CONFIG.spinDuration);
}
function showTrack(){
  el.lsec.classList.add('hidden');
  el.tsec.classList.remove('hidden');
  el.goal.innerText=state.goal;
  update();render();
}
function add(){
  const v=parseInt(el.input.value);if(!v||v<=0)return;
  state.log.push({c:v,t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
  state.consumed+=v;save();el.input.value='';update();render();
}
function del(i){state.consumed-=state.log[i].c;state.log.splice(i,1);save();update();render();}
function update(){
  const pct=Math.min(state.consumed/state.goal*100,150);
  el.fill.style.width=Math.min(pct,100)+'%';el.marker.style.left=Math.min(pct,100)+'%';
  el.text.innerText=`${state.consumed}/${state.goal}`;
  el.fill.classList.toggle('over',pct>100);
  el.done.classList.toggle('hidden',!state.log.length);
}
function render(){
  el.list.innerHTML='';
  state.log.forEach((e,i)=>{
    let li=document.createElement('li');
    li.innerHTML=`<span>${e.t}</span><span>${e.c} cal</span><button class="delete-btn">×</button>`;
    li.querySelector('button').onclick=()=>del(i);
    el.list.appendChild(li);
  });
}
function complete(){
  let reward=REWARDS[Math.floor(Math.random()*REWARDS.length)];
  let pts=10; if(state.consumed<state.goal)pts+=15; else if(state.consumed===state.goal)pts+=20; else pts+=5;
  let bonus=parseInt(reward.text.match(/\d+/)[0]); pts+=bonus;
  state.points+=pts; state.streak++; save();
  el.streak.textContent=state.streak; el.points.textContent=state.points;
  el.popE.textContent=reward.emoji;
  el.popT.textContent="Day Complete!";
  el.popM.textContent=`You ate ${state.consumed}/${state.goal} cal`;
  el.popR.innerHTML=`${reward.text} (Total +${pts} pts)`;
  el.popO.classList.remove('hidden'); el.done.classList.add('hidden');
}
</script>
</body>
</html>
